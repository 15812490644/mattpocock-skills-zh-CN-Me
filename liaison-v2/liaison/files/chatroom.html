/* ================= WebSocket 客户端 ================= */
/* 主动关闭旧连接：给 ws 实例打标记（而非共享的 S.closing —— 那是个竞态：
   S.closing 在同步代码里先 true 后 false，而 onclose 是异步派发的，
   派发时 S.closing 已被重置，主动关闭会被误判为意外断线 → scheduleReconnect
   → 1 秒后 connect 又关掉刚连上的新连接 → 每秒断连死循环。
   QA 实测：切换房间/重进房间必触发，页面会永远每秒重连并覆盖本地翻页数据。）*/
function closeWsVoluntarily(){
  if (!S.ws) return;
  S.ws.__voluntary = true;
  try { S.ws.close(); } catch(e){}
  S.ws = null;
}
function connect(){
  closeWsVoluntarily();
  S.everHello = false;
  setDot("wait");
  if (USE_POLLING){ startPolling(); return; }
  const url = buildWsUrl(S.addr, S.room, S.client, S.lastId > 0 ? S.lastId : -1, S.token);
  if (!url){ connFail("地址看不懂"); return; }
  let ws;
  try { ws = new WebSocket(url); } catch(e){ connFail(e.message); return; }
  S.ws = ws;
  const guard = setTimeout(() => { if (ws.readyState === 0){ try{ ws.close(); }catch(e){} } }, 8000);
  ws.onopen = () => { clearTimeout(guard); };
  ws.onmessage = ev => { try { handleFrame(JSON.parse(ev.data)); } catch(e){} };
  ws.onclose = () => {
    clearTimeout(guard);
    if (ws.__voluntary || S.closing) return;   /* 主动关闭 → 不重连 */
    S.connected = false;
    setDot("bad");
    $("#reconnBar").classList.add("on");
    /* 连续 2 次从未握手成功 → 自动降级长轮询（WS 被网络/代理拦截的环境） */
    if (!S.everHello && !S.pollMode){
      S.wsFails++;
      if (S.wsFails >= 2){ switchToPoll(); return; }
    }
    scheduleReconnect();
  };
  ws.onerror = () => {};
  clearInterval(S.pingTimer);
  S.pingTimer = setInterval(() => { if (ws.readyState === 1) send({ type: "ping", t: Date.now() }); }, 20000);
}
/* 切换长轮询模式：收发全部走 HTTP，功能不受影响 */
function switchToPoll(){
  if (S.pollMode) return;
  S.pollMode = true;
  closeWsVoluntarily();
  $("#reconnBar").classList.remove("on");
  toast("WebSocket 连不上，已自动切换备用通道（长轮询），收发不受影响");
  startPolling();
}
function scheduleReconnect(){
  const d = Math.min(15000, S.backoff);
  S.backoff = Math.min(15000, S.backoff * 1.6);
  setTimeout(() => { if (!S.closing && S.addr) connect(); }, d);
}
function setDot(k){
  $("#connDot").className = "dot " + (k === "ok" ? "ok" : k === "wait" ? "wait" : "bad");
  if (k === "ok"){ $("#reconnBar").classList.remove("on"); S.backoff = 1000; }
}
function connFail(msg){
  $("#connErr").textContent = "连不上。请检查：① 地址、房间号有没有抄错；② 问问 AI 是不是还在开工状态。" + (msg ? "（" + msg + "）" : "");
  $("#connErr").classList.add("on");
  $("#goBtn").disabled = false; $("#goBtn").textContent = "进入聊天室";
}
function send(obj){
  if (S.pollMode){ return httpSend(obj); }        /* 长轮询模式：发送走 HTTP */
  if (S.ws && S.ws.readyState === 1){ S.ws.send(JSON.stringify(obj)); return true; }
  return false;
}
/* 长轮询模式 HTTP 发送（chat 走 /send，image 走 /upload，ping 忽略） */
function httpSend(obj){
  if (obj.type === "ping") return true;
  let url, body;
  if (obj.type === "chat"){
    url = buildHttpUrl(S.addr, "/send");
    if (!url) return false;
    body = { room: S.room, client: S.client, text: obj.text, tempId: obj.tempId, token: S.token };
  } else if (obj.type === "image"){
    url = buildHttpUrl(S.addr, "/upload");
    if (!url) return false;
    body = { room: S.room, client: S.client, name: obj.name, caption: obj.caption, dataBase64: obj.dataBase64, token: S.token };
  } else return false;
  if (S.token) url = appendQuery(url, new URLSearchParams({ token: S.token }));
  fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
               body: JSON.stringify(body) })
    .then(r => r.json())
    .then(d => {
      if (d.ok && typeof d.id === "number" && obj.tempId) handleFrame({ type: "ack", id: d.id, tempId: obj.tempId });
      else if (d.error) toast(d.error);
    })
    .catch(() => { /* 失败保留本地 pending，下次 poll 周期可见是否送达 */ });
  return true;
}

/* ================= 帧处理 ================= */
/* 历史合并（重连不截断已翻页旧历史）：本地一律保留，服务器版本按 id 覆盖补字段，
 * 新消息按序插入，本地 pending（t: 前缀）始终排末尾。 */
function mergeMsgs(prev, incoming){
  if (!prev.length) return incoming;
  const byId = {};
  incoming.forEach(m => { byId[m.id] = m; });
  const merged = [];
  for (const m of prev){
    const srv = byId[m.id];
    if (srv){
      merged.push(Object.assign({}, srv, {
        state: m.state, tempId: m.tempId,        /* 本地发送状态优先保留 */
      }));
      delete byId[m.id];
    } else {
      merged.push(m);                           /* 翻页加载的旧历史：保留 */
    }
  }
  const fresh = Object.keys(byId).map(k => byId[k])
    .filter(m => typeof m.id === "number")
    .sort((a, b) => a.id - b.id);
  if (fresh.length){
    const minNew = fresh[0].id;
    let at = -1;
    for (let i = 0; i < merged.length; i++){
      const x = merged[i];
      if (typeof x.id === "number" ? x.id > minNew : true){ at = i; break; }
    }
    if (at < 0) at = merged.length;
    merged.splice.apply(merged, [at, 0].concat(fresh));
  }
  return merged;
}
function handleFrame(f){
  if (f.type === "hello"){
    S.connected = true; setDot("ok");
    S.everHello = true; S.wsFails = 0;
    S.title = f.title || S.room;
    $("#hTitle").textContent = S.title;
    updateOnline(f.clients);
    saveRoom();
    return;
  }
  if (f.type === "history"){
    /* 合并语义（对齐 React 版）：本地一律保留（含翻页加载的旧历史），
     * 服务器版本按 id 覆盖补字段，新消息按序插入，pending 始终排末尾。
     * 旧实现全量替换 → 重连时服务器只回最近 200 条会把已翻页的旧消息截掉。 */
    const incoming = (f.messages || []).map(x => Object.assign({}, x));
    S.msgs = mergeMsgs(S.msgs, incoming);
    S.byId = {}; S.msgs.forEach(m => { S.byId[m.id] = m; });
    S.lastId = f.lastId || S.lastId;
    S.total = (typeof f.total === "number") ? Math.max(f.total, S.msgs.length) : S.msgs.length;
    S.reactions = f.reactions || {};                 /* 表情反应随历史同步 */
    S.revoked = {};                                  /* 撤回标记随历史同步 */
    (f.revoked || []).forEach(k => { S.revoked[k] = true; });
    S.read = {};                                     /* 已读回执随历史同步 */
    (f.read || []).forEach(k => { S.read[k] = true; });
    (f.messages || []).forEach(x => { if (x.read) S.read[String(x.id)] = true; });
    S.pending = f.pending || []; S.task = f.task || null; S.done = !!f.done;
    rebuildStream(); renderBanner();
    show("chat");
    $("#goBtn").disabled = false; $("#goBtn").textContent = "进入聊天室";
    $("#connErr").classList.remove("on");
    if (S.outboxQ.length) flushQueue();
    return;
  }
  if (f.type === "reaction"){
    /* 表情反应同步：更新内存表 + 局部刷新该消息的 chips（不全量重建） */
    S.reactions = S.reactions || {};
    if (f.reactions && Object.keys(f.reactions).length) S.reactions[String(f.target)] = f.reactions;
    else delete S.reactions[String(f.target)];
    updateRxnChips(f.target);
    /* 提醒：别人对我的消息点反应 → toast + 声音（演示 bot 的自动反应会触发这里） */
    if (f.client && f.client !== S.client){
      const mine = S.byId[f.target];
      if (mine && mine.from === "user" && mine.client === S.client){
        let emoji = null;
        if (S.reactions[String(f.target)])
          for (const e of Object.keys(S.reactions[String(f.target)]))
            if ((S.reactions[String(f.target)][e] || []).indexOf(f.client) >= 0){ emoji = e; break; }
        if (emoji){ beep("pop"); toast(emoji + " 有人给你的消息点了反应"); }
      }
    }
    return;
  }
  if (f.type === "revoke"){
    /* 撤回同步：标记 + 局部遮蔽该消息气泡 */
    markRevoked(f.target);
    return;
  }
  if (f.type === "edit"){
    /* 编辑同步：替换文本 + 「已编辑」角标（含自己其他设备） */
    applyEdit(f.target, f.text, f.ts, f.hist);
    return;
  }
  if (f.type === "ack_read"){
    /* 已读回执：✓ 升级 ✓✓ */
    markRead(f.target);
    return;
  }
  if (f.id && f.from){                        // 聊天消息广播（无 type 字段）
    onChatBroadcast(f);
    return;
  }
  if (f.type === "ack"){
    const local = S.byId["t:" + f.tempId];
    if (local){
      /* 兑换前先拿旧节点（data-mid 是 tempId），兑换后 id 变数字就查不到了 */
      const oldNode = document.querySelector('[data-mid="' + local.id + '"]');
      delete S.byId[local.id];
      local.id = f.id; local.state = "sent";
      S.byId[f.id] = local;
      /* 重渲染：补上反应/撤回按钮（pending 时 id 是字符串不渲染操作组） */
      if (oldNode) oldNode.replaceWith(renderMsg(local));
    }
    return;
  }
  if (f.type === "pending"){ S.pending = f.asks || []; renderBanner(); if (S.pending.length) beep("notice"); return; }
  if (f.type === "task"){
    S.task = f.task; S.done = !!f.done;
    if (f.done) toast("🎉 任务完成");
    return;
  }
  if (f.type === "typing"){
    if (f.who === "liaison"){
      $("#typing").classList.toggle("on", !!f.on);
      if (f.on){
        clearTimeout(S.typingOff);
        S.typingOff = setTimeout(() => $("#typing").classList.remove("on"), 6000);
      }
    }
    return;
  }
  if (f.type === "status"){ updateOnline(f.clients); return; }
  if (f.type === "reset"){                    // 房间被重置（演示模式）→ 清空本地，等新消息
    S.msgs = []; S.lastId = 0; S.byId = {}; S.total = 0;
    S.pending = []; S.task = null; S.done = false;
    S.reactions = {}; S.revoked = {}; S.read = {};
    rebuildStream(); renderBanner();
    toast("🔄 房间已重置");
    return;
  }
  if (f.type === "error"){
    if (f.code === "no-room" || f.code === "bad-room" || f.code === "forbidden"){
      toast(f.message);
      setTimeout(() => leaveToConnect(f.message), 1000);
    } else toast(f.message || "出了点小问题");
    return;
  }
}

/* 聊天广播：自己发的消息与本地待确认消息去重合并 */
function onChatBroadcast(f){
  if (f.from === "user" && f.client === S.client){
    // 找到同文本的本地 pending 消息 → 原地升级（避免重复气泡）
    for (let i = S.msgs.length - 1; i >= 0; i--){
      const m = S.msgs[i];
      if (m.state === "pending" && m.from === "user" && m.text === f.text &&
          Math.abs((m.ts || 0) - (f.ts || 0)) < 60000){
        const oldNode = document.querySelector('[data-mid="' + m.id + '"]');   /* 兑换前查 */
        delete S.byId[m.id];
        m.id = f.id; m.state = "sent"; m.ts = f.ts || m.ts;
        if (f.image) m.image = f.image;
        m.client = f.client;
        S.byId[f.id] = m;
        /* 重渲染：补上反应/撤回按钮（pending 时 id 是字符串不渲染操作组） */
        if (oldNode) oldNode.replaceWith(renderMsg(m));
        if (f.id > S.lastId) S.lastId = f.id;
        return;
      }
    }
  }
  if (S.byId[f.id]) return;
  const m = Object.assign({}, f);
  S.msgs.push(m); S.byId[m.id] = m;
  if (m.id > S.lastId) S.lastId = m.id;
  appendStream(m);
  if (m.from === "liaison" || m.from === "system") beep(document.hidden ? "notice" : "pop");
}

/* ================= 发送（含离线队列） ================= */
function quotePrefix(r){
  const who = r.from === "user" ? "我" : "通讯官";
  const when = r.ts ? " " + fmtTime(r.ts) : "";
  const brief = (r.text || "").replace(/\s+/g, " ").trim().slice(0, 40);
  return "↩ 引用 " + who + when + " 的「" + brief + "」：\n";
}
/* 消息升级（pending → sent / id 兑换）后重渲染该行（补上反应/撤回按钮） */
function rerenderMsg(m){
  const node = document.querySelector('[data-mid="' + String(m.id) + '"]');
  if (node) node.replaceWith(renderMsg(m));
}
function sendChat(text){
  text = (text || "").trim(); if (!text) return;
  if (S.replyTo){ text = quotePrefix(S.replyTo) + text; cancelReply(); }
  const tempId = "t" + Date.now() + Math.random().toString(36).slice(2, 6);
  const local = { id: "t:" + tempId, tempId, from: "user", text, ts: Date.now(), state: "pending" };
  S.msgs.push(local); S.byId[local.id] = local;
  appendStream(local);
  const ok = send({ type: "chat", text, tempId });
  if (!ok){
    S.outboxQ.push({ type: "chat", text, tempId });
    toast("现在没连上，先存着，连上自动发");
  }
}
function sendImagePayload(base64, name, caption){
  const tempId = "t" + Date.now() + Math.random().toString(36).slice(2, 6);
  const local = { id: "t:" + tempId, tempId, from: "user", text: caption || "（图片）",
                  ts: Date.now(), state: "pending" };
  S.msgs.push(local); S.byId[local.id] = local;
  appendStream(local);
  const payload = { type: "image", name, caption: caption || "", dataBase64: base64, tempId };
  const ok = send(payload);
  if (!ok){ S.outboxQ.push(payload); toast("现在没连上，图片先存着，连上自动发"); }
}
function flushQueue(){
  const q = S.outboxQ.slice(); S.outboxQ = [];
  for (const item of q){
    if (!send(item)){ S.outboxQ.push(item); break; }
  }
}

/* ================= 图片（压缩 + 粘贴 + 拖拽） ================= */
function compress(file){
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type || "")){ reject("只能发图片"); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const r = Math.min(1, IMG_MAX_EDGE / Math.max(w, h));
      w = Math.round(w * r); h = Math.round(h * r);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const isPng = /png$/i.test(file.type || "");
      cv.toBlob(b => {
        if (!b){ reject("图片处理失败"); return; }
        const fr = new FileReader();
        fr.onload = () => resolve({ base64: String(fr.result).split(",")[1],
                                    name: file.name || "image." + (isPng ? "png" : "jpg") });
        fr.onerror = () => reject("读取图片失败");
        fr.readAsDataURL(b);
      }, isPng ? "image/png" : "image/jpeg", IMG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject("这张图打不开，换一张试试"); };
    img.src = url;
  });
}
function sendImage(file){
  $("#upRow").classList.add("on");
  compress(file).then(({ base64, name }) => {
    $("#upRow").classList.remove("on");
    sendImagePayload(base64, name, "");
  }).catch(msg => { $("#upRow").classList.remove("on"); toast(msg); });
}

const FILE_NOTES = {
  "chat-in.md": "你说的话 · 监控写",
  "chat-out.md": "通讯官的话",
  "inbox.md": "消息卡片 → 主agent",

  "outbox.md": "待答问题 ← 主agent",
  "outbox-replies.md": "你的答复 → 主agent",
  "status.md": "任务状态",
};
const FILE_ICONS = {
  "chat-in.md": "🗣️", "chat-out.md": "🫡", "inbox.md": "📥", "inbox-status.md": "✅",
  "outbox.md": "❓", "outbox-replies.md": "↩️", "status.md": "📊",
};
async function renderMailboxFiles(container){
  const base = buildHttpUrl(S.addr, "/files");
  if (!base){ toast("无法构建地址"); return; }
  const q = new URLSearchParams({ room: S.room });
  if (S.token) q.set("token", S.token);
  const spin = document.createElement("button");
  spin.className = "mfiles-refresh";
  spin.innerHTML = "<svg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><path d='M21 12a9 9 0 1 1-6.2-8.6'/></svg> 正在拉取九文件…";
  spin.disabled = true;
  container.appendChild(spin);
  try {
    const r = await fetch(appendQuery(base, q), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    spin.remove();
    renderMailboxList(container, d);
  } catch(e){
    spin.remove();
    const err = document.createElement("div");
    err.style.cssText = "text-align:center;color:var(--tx3);font-size:12.5px;padding:18px 8px;line-height:1.7;white-space:pre-line";
    err.textContent = "拉不到文件（" + e.message + "）。\n确认哨兵进程还在跑，点下方重试。";
    container.appendChild(err);
    renderMailboxRetry(container);
  }
}
function renderMailboxRetry(container){
  const btn = document.createElement("button");
  btn.className = "mfiles-refresh";
  btn.textContent = "↻ 重新拉取";
  btn.addEventListener("click", () => {
    container.querySelectorAll(".mfile, .mfiles-refresh, [style*='text-align:center']").forEach(n => n.remove());
    renderMailboxFiles(container);
  });
  container.appendChild(btn);
}
function renderMailboxList(container, snap){

    const none = document.createElement("div");
    none.style.cssText = "text-align:center;color:var(--tx3);font-size:12.5px;padding:14px";
    none.textContent = "（服务器上还没有文件——发一条消息就有了）";
    container.appendChild(none);
  }
  for (const f of files){
    const card = document.createElement("div");
    card.className = "mfile" + (S.filesTab === f.name ? " open" : "");
    const h = document.createElement("div"); h.className = "mfile-h";
      h.setAttribute("role", "button"); h.tabIndex = 0;
      h.setAttribute("aria-expanded", card.classList.contains("open") ? "true" : "false");
    const ic = document.createElement("div"); ic.className = "mf-ic"; ic.textContent = FILE_ICONS[f.name] || "📄";
    const nm = document.createElement("div");
      nm.style.cssText = "flex:none"; nm.className = "mf-name"; nm.textContent = f.name;
    const note = document.createElement("div"); note.className = "mf-note"; note.textContent = FILE_NOTES[f.name] || "";
    const meta = document.createElement("div"); meta.className = "mf-meta";
      meta.textContent = (f.size >= 1024 ? (f.size / 1024).toFixed(1) + "KB" : f.size + "B") +
        " · " + String((f.content || "").split("\n").length) + " 行";
    const arrow = document.createElement("div"); arrow.className = "mf-arrow";
      arrow.innerHTML = "<svg width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>";
    h.append(ic, nm, note, meta, arrow);
    card.appendChild(h);
    const bodyEl = document.createElement("div"); bodyEl.className = "mfile-body";
    const wrap = document.createElement("div"); wrap.className = "mf-body-wrap";
    const pre = document.createElement("pre"); pre.className = "mfile-pre";
    pre.textContent = f.content || "（空文件）";
    if (f.truncated){
      const t = document.createElement("span"); t.className = "trunc";
      t.textContent = "内容超过 6KB，只显示前面部分——导出快照可看全文";
      pre.appendChild(t);
    }
    wrap.appendChild(pre);
    bodyEl.appendChild(wrap);
    card.appendChild(bodyEl);
    h.addEventListener("click", () => {
      const open = card.classList.toggle("open");
      S.filesTab = open ? f.name : (S.filesTab === f.name ? null : S.filesTab);
      h.setAttribute("aria-expanded", open ? "true" : "false");
    });
    h.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); h.click(); }
    });
    container.appendChild(card);
  }
  /* 底部刷新 */
  const btn = document.createElement("button");
  btn.className = "mfiles-refresh";
  btn.innerHTML = "<svg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><path d='M21 12a9 9 0 1 1-6.2-8.6'/></svg> 刷新文件内容";
  btn.addEventListener("click", () => {
    container.querySelectorAll(".mfile, .mfiles-refresh").forEach(n => n.remove());
    renderMailboxFiles(container);
  });
  container.appendChild(btn);
  /* 概览条 */
  const stat = document.createElement("div");
  stat.style.cssText = "font-size:11px;color:var(--tx3);text-align:center;padding:8px 0 2px";
  stat.textContent = "共 " + files.length + " 个文件 · 房间 " + (snap.room || S.room) +
    (snap.demo ? " · 演示模式" : "");

}

function exportChat(){
  const lines = ["# 房间 " + S.room + " · " + S.title,
                 "# 导出时间 " + new Date().toLocaleString("zh-CN"), ""];
  for (const m of S.msgs){
    if (String(m.id).indexOf("t:") === 0 && m.state === "pending") continue;
    const who = m.from === "user" ? "我" : m.from === "system" ? "系统" : "通讯官";
    lines.push("[" + (m.ts ? fmtTime(m.ts) : "") + "] " + who + "：" +
               (m.image ? "[图片] " : "") + (m.text || ""));
  }
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "聊天记录-房间" + S.room + ".txt";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* 导出九文件快照（watcher /export，服务器生成 ZIP/MD 并以下载附件返回） */

  const q = new URLSearchParams();

/* ================= 长轮询备用通道（USE_POLLING=true 时启用） ================= */
let pollTimer = null;
function startPolling(){ pollOnce(true); }
function stopPolling(){ clearTimeout(pollTimer); pollTimer = null; }
function pollOnce(first){
  if (!S.addr || S.closing) return;
  const base = buildHttpUrl(S.addr, "/poll");
  if (!base){ connFail("地址看不懂"); return; }
  const q = new URLSearchParams();
  q.set("room", S.room); q.set("client", S.client); q.set("since", String(S.lastId || -1));
  if (S.token) q.set("token", S.token);
  fetch(appendQuery(base, q), { cache: "no-store" })
    .then(r => r.json())
    .then(f => {
      if (f.error){ connFail(f.error); return; }
      if (first || !S.connected){
        handleFrame({ type: "hello", title: (f.task || {}).current, clients: f.clients });
        handleFrame({ type: "history", messages: f.messages, lastId: f.lastId,
                      total: f.total,
                      pending: f.pending, task: f.task, done: f.done,
                      reactions: f.reactions, revoked: f.revoked, read: f.read });
      } else {
        (f.messages || []).forEach(m => handleFrame(m));
        /* poll 每帧带全量撤回/已读列表：与本地 diff 后增量应用 */
        if (Array.isArray(f.revoked))
          f.revoked.forEach(k => { if (!S.revoked[k]) markRevoked(Number(k)); });
        if (Array.isArray(f.read))
          f.read.forEach(k => { if (!S.read[k]) markRead(Number(k)); });
        /* poll 带编辑映射（含旧消息）：与本地 diff 后增量应用 */
        if (f.editedMap && typeof f.editedMap === "object"){
          for (const k of Object.keys(f.editedMap)){
            const v = f.editedMap[k] || {};
            const mm = S.byId[Number(k)];
            if (mm && v.text && (mm.text !== v.text || !mm.edited)) applyEdit(Number(k), v.text, v.ts, v.hist);
          }
        }
        handleFrame({ type: "pending", asks: f.pending });
        if (typeof f.clients === "number") updateOnline(f.clients);
      }
      S.connected = true; setDot("ok");
      pollTimer = setTimeout(() => pollOnce(false), 600);
    })
    .catch(() => {
      S.connected = false; setDot("bad"); $("#reconnBar").classList.add("on");
      pollTimer = setTimeout(() => pollOnce(false), 3000);
    });
}

/* ================= 启动 ================= */
function boot(){
  S.sound = LS.sound;
  $("#btnSound").textContent = S.sound ? "🔔" : "🔕";
  applyTheme();
  renderChips();
  const q = new URLSearchParams(location.search);
  let a = q.get("addr"), r = q.get("room");
  /* 网关深链：只带 XTransformPort+room 时，用当前 origin 自动补 addr（无需手写长地址） */
  if (!a && r && q.get("XTransformPort")){
    a = location.origin + "/?XTransformPort=" + q.get("XTransformPort");
  }
  /* 网关深链辅助：只带 XTransformPort 没 room 时，预填地址栏（省得手抄长地址） */
  if (!a && !r && q.get("XTransformPort")){
    $("#addrInput").value = location.origin + "/?XTransformPort=" + q.get("XTransformPort");
  }
  if (a && r){ enterRoom(a, r, q.get("title") || r, q.get("token") || undefined); return; }
  const last = LS.last;
  if (last && last.addr && last.room){
    $("#addrInput").value = last.addr;
    $("#roomInput").value = last.room;
    $("#tokInput").value = LS.token;          /* 上次用过的口令预填（没有则空） */
    enterRoom(last.addr, last.room, last.title);
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden){
      S.nearBottom = true;
      $("#stream").scrollTop = $("#stream").scrollHeight;
      S.unread = 0; updateFab();
    }
  });
  /* 窗口过期心跳：挂着 编辑/撤回 按钮的消息每 15s 重渲染一次（跳过正在内联编辑的行），
   * 窗口过期后按钮即时消失（renderMsg 重挂时不再注册 → 自然退出观察集） */
  setInterval(() => {
    if (!S.winWatch.size) return;
    const ids = [...S.winWatch];
    S.winWatch = new Set();
    for (const id of ids){
      const node = document.querySelector('[data-mid="' + String(id) + '"]');
      const m = S.byId[id];
      if (node && m && !node.querySelector(".edit-box")) node.replaceWith(renderMsg(m));
      else if (node && m) S.winWatch.add(id);   /* 正在编辑中：下次心跳再看 */
    }
  }, 15000);
}
boot();
</script>
